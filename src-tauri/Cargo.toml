[package]
name = "clipo"
version = "0.1.0"
description = "Cross-platform clipboard history and snippet manager"
authors = ["Tamzid Peace"]
license = "MIT"
edition = "2021"

[lib]
name = "clipo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clipo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
nucleo-matcher = "0.3"
regex = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }

[lints.cargo]
# Tasks 2-7 wire up chrono, image, nucleo-matcher, sha2, regex, uuid, and tokio.
unused_dependencies = "allow"
